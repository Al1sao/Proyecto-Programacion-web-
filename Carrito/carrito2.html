<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagar - Tienda de Juegos</title>
  <link rel="stylesheet" href="carritocss.css">
</head>

<body>
  <header>
    <h1 style="color: #66fcf1; margin: 0; font-size: 1.8em;">MKL GAMES</h1>
  </header>

  <main>
    <aside class="cart">
      <h2>Resumen de compra</h2>

      <div class="summary-row"><span>Artículos:</span><span id="itemsCount">0</span></div>
      <div class="summary-row"><span>Subtotal:</span><span id="subtotal">0.00 USD</span></div>
      <div class="summary-row"><span>Descuento:</span><span id="discount">0% (0.00 USD)</span></div>

      <fieldset class="payment">
        <legend>Medio de pago</legend>
        <label><input type="radio" name="payment" value="transfer" checked> Transferencia (sin recargo)</label>
        <label><input type="radio" name="payment" value="debit"> Tarjeta débito (+5%)</label>
        <label><input type="radio" name="payment" value="credit"> Tarjeta crédito (+7%)</label>
        <label class="cuotas">Cuotas:
          <select id="installments">
            <option value="1">1</option>
            <option value="3">3 (+5%)</option>
            <option value="6">6 (+10%)</option>
            <option value="9">9 (+12%)</option>
            <option value="12">12 (+15%)</option>
          </select>
        </label>
      </fieldset>

      <div class="summary-row"><span>Recargo pago:</span><span id="surcharge">0.00 USD</span></div>
      <div class="summary-row total"><span>Total:</span><span id="total">0.00 USD</span></div>
      <div class="summary-row"><span>Por cuota:</span><span id="perInstallment">0.00 USD</span></div>

      <button id="payBtn" class="btn">Pagar Ahora</button>
    </aside>
  </main>

  <footer><p>&copy; 2024 Tienda de Juegos</p></footer>

  <div class="thank-you-popup" id="thankYouPopup">
    <div class="thank-you-content">
      <div class="thank-you-icon">🎮</div>
      <div class="thank-you-title">¡Gracias!</div>
      <div class="thank-you-message">Gracias por tu compra en</div>
      <div class="thank-you-store">MKL Games</div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="../Java.js"></script>
</body>
</html>
